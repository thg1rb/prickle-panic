name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.29.2

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.27.2
          cache-dependency-path: apps/server/go.mod

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check && pnpm go:format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Frontend tests
        run: pnpm test:web

      - name: Protocol contract fixtures
        run: pnpm protocol:check

      - name: Go tests
        run: pnpm test:go

      - name: Go vet
        run: pnpm vet:go

      - name: Frontend build
        run: pnpm build

      - name: JavaScript dependency audit
        run: pnpm audit --prod --audit-level high

      - name: Go vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
        working-directory: apps/server
